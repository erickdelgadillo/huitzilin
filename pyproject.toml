[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huitzilin"
version = "0.1.0"
description = "Scientific literature retrieval and ranking from PubMed."
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.87",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
huitzilin = "huitzilin.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
